name: Miri

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC (offset from fuzz midnight cron)

jobs:
  miri:
    name: Miri (${{ matrix.crate }}, ${{ matrix.configuration }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      MIRIFLAGS: "-Zmiri-tree-borrows -Zmiri-disable-isolation -Zmiri-ignore-leaks"
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: dotnet-value
            configuration: default-features
            args: '-- --test-threads=1'
          - crate: dotnet-utils
            configuration: no-features
            args: '--no-default-features -- --test-threads=1'
          - crate: dotnet-assemblies
            configuration: default-features
            args: '-- --test-threads=1'
          - crate: dotnet-vm
            configuration: no-features
            args: '--no-default-features -- --test-threads=1 jmp_tests tail_calls fault_tests'
          - crate: dotnet-vm
            configuration: multithreading
            args: '--no-default-features --features multithreading -- --test-threads=1 jmp_tests tail_calls fault_tests'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (nightly + miri)
        # `rustc +nightly --version` was 1.98.0-nightly (d1fc603d1 2026-05-26).
        # The matching dated Rustup channel is nightly-2026-05-27.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-27
          components: miri

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.2

      - name: Setup .NET SDK (10.0.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev

      - name: Run Miri (${{ matrix.crate }}, ${{ matrix.configuration }})
        run: cargo +nightly-2026-05-27 miri test -p ${{ matrix.crate }} ${{ matrix.args }}
