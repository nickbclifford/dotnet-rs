name: Miri

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC (offset from fuzz midnight cron)

jobs:
  # Each phase runs through scripts/ci_diagnostics.py with durable logs/status metadata.
  # CI_DIAG_DEADLINE ends inner budgets 3 minutes before timeout-minutes (keep in sync) so an
  # exhausted suite is recorded as budget exhaustion and its artifact still uploads.
  miri:
    name: Miri (${{ matrix.crate }}, ${{ matrix.configuration }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      MIRIFLAGS: "-Zmiri-tree-borrows -Zmiri-disable-isolation -Zmiri-ignore-leaks"
      CI_DIAG_TOOLCHAIN: nightly-2026-05-27
      CI_DIAG_FEATURES: ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: dotnet-value
            configuration: default-features
            cargo-args: ''
            test-args: '--test-threads=1'
          - crate: dotnet-utils
            configuration: no-features
            cargo-args: '--no-default-features'
            test-args: '--test-threads=1'

    steps:
      - name: Start diagnostics budget
        run: |
          echo "CI_DIAG_DIR=$RUNNER_TEMP/ci-diagnostics" >> "$GITHUB_ENV"
          echo "CI_DIAG_DEADLINE=$(( $(date +%s) + 30 * 60 - 180 ))" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ci-diagnostics"

      - uses: actions/checkout@v4

      - name: Setup Rust (nightly + miri)
        # `rustc +nightly --version` was 1.98.0-nightly (d1fc603d1 2026-05-26).
        # The matching dated Rustup channel is nightly-2026-05-27.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-27
          components: miri

      - name: Rust Cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2.8.2

      - name: Record cache identity
        run: echo "CI_DIAG_CACHE=rust-cache-hit=${{ steps.rust-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"

      - name: Setup .NET SDK (10.0.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev

      - name: Miri sysroot setup
        run: python3 scripts/ci_diagnostics.py run --phase setup --subphase miri-sysroot --case miri-sysroot --timeout 600 -- cargo +nightly-2026-05-27 miri setup

      - name: Compile Miri tests (${{ matrix.crate }}, ${{ matrix.configuration }})
        run: |
          python3 scripts/ci_diagnostics.py run --phase compile --case '${{ matrix.crate }}-${{ matrix.configuration }}' --timeout 900 -- \
            cargo +nightly-2026-05-27 miri test -p ${{ matrix.crate }} ${{ matrix.cargo-args }} --no-run

      - name: Run Miri (${{ matrix.crate }}, ${{ matrix.configuration }})
        run: |
          python3 scripts/ci_diagnostics.py run --phase execute --case '${{ matrix.crate }}-${{ matrix.configuration }}' --timeout 1800 -- \
            cargo +nightly-2026-05-27 miri test -p ${{ matrix.crate }} ${{ matrix.cargo-args }} -- ${{ matrix.test-args }}

      - name: Summarize diagnostics
        if: always()
        run: |
          if [ -n "${CI_DIAG_DIR:-}" ] && [ -f scripts/ci_diagnostics.py ]; then
            python3 scripts/ci_diagnostics.py summarize --advisory --outcome '${{ job.status }}' \
              --title 'Miri (${{ matrix.crate }}, ${{ matrix.configuration }})' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-miri-${{ matrix.crate }}-${{ matrix.configuration }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-diagnostics
          if-no-files-found: warn
          retention-days: 14

  # The matrix comes from the reviewed manifest, not from the independent Miri listing.
  # If generation fails, the invalid sentinel still creates an advisory guard failure.
  advisory-matrix:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix || steps.fallback.outputs.matrix }}
    steps:
      - id: fallback
        run: echo 'matrix={"include":[{"crate":"invalid","configuration":"invalid","shard":"invalid"}]}' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python3 scripts/tests/test_miri_advisory.py
          matrix="$(python3 scripts/miri_advisory.py matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  advisory-shards:
    name: Miri (${{ matrix.crate }}, ${{ matrix.configuration }}, ${{ matrix.shard }})
    needs: advisory-matrix
    runs-on: ubuntu-latest
    # Provisional cold budget only: 5m setup + 5m compile + 45m execution,
    # 25% headroom, rounded to 70m. Inner execution cap 50m; remeasure in 4.4.
    timeout-minutes: 70
    continue-on-error: true
    env:
      MIRIFLAGS: "-Zmiri-tree-borrows -Zmiri-disable-isolation -Zmiri-ignore-leaks"
      CI_DIAG_TOOLCHAIN: nightly-2026-05-27
      CI_DIAG_FEATURES: ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.advisory-matrix.outputs.matrix) }}
    steps:
      - name: Start diagnostics budget
        run: |
          echo "CI_DIAG_DIR=$RUNNER_TEMP/ci-diagnostics" >> "$GITHUB_ENV"
          echo "CI_DIAG_DEADLINE=$(( $(date +%s) + 70 * 60 - 180 ))" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ci-diagnostics"
      - uses: actions/checkout@v4
      - name: Setup Rust (nightly + miri)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-27
          components: miri
      - name: Rust Cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2.8.2
        with:
          shared-key: miri-advisory-v2-nightly-2026-05-27-${{ matrix.crate }}-${{ matrix.configuration }}-${{ matrix.shard }}
      - name: Record cache identity
        run: echo "CI_DIAG_CACHE=miri-advisory-v2-nightly-2026-05-27-${{ matrix.crate }}-${{ matrix.configuration }}-${{ matrix.shard }},rust-cache-hit=${{ steps.rust-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"
      - name: Setup .NET SDK (10.0.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev
      - name: Miri sysroot setup
        run: python3 scripts/ci_diagnostics.py run --phase setup --subphase miri-sysroot --case miri-sysroot --timeout 300 -- cargo +nightly-2026-05-27 miri setup
      - name: Compile original Miri selection
        run: |
          features=()
          if [ '${{ matrix.configuration }}' != default-features ]; then features+=(--no-default-features); fi
          if [ '${{ matrix.configuration }}' = multithreading ]; then features+=(--features multithreading); fi
          python3 scripts/ci_diagnostics.py run --phase compile --case '${{ matrix.shard }}' --timeout 300 -- \
            cargo +nightly-2026-05-27 miri test -p '${{ matrix.crate }}' "${features[@]}" --no-run
      - name: Verify original Miri selection and singleton partition
        run: |
          python3 scripts/ci_diagnostics.py run --phase guard --case '${{ matrix.shard }}' --timeout 300 -- \
            python3 scripts/miri_advisory.py verify --configuration '${{ matrix.configuration }}'
      - name: Run exact singleton
        run: |
          python3 scripts/ci_diagnostics.py run --phase execute --case '${{ matrix.shard }}' --timeout 3000 -- \
            python3 scripts/miri_advisory.py execute --configuration '${{ matrix.configuration }}' --shard '${{ matrix.shard }}'
      - name: Summarize diagnostics
        if: always()
        run: |
          if [ -n "${CI_DIAG_DIR:-}" ] && [ -f scripts/ci_diagnostics.py ]; then
            python3 scripts/ci_diagnostics.py summarize --advisory --outcome '${{ job.status }}' \
              --title 'Miri (${{ matrix.crate }}, ${{ matrix.configuration }}, ${{ matrix.shard }})' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-miri-${{ matrix.crate }}-${{ matrix.configuration }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-diagnostics
          if-no-files-found: warn
          retention-days: 14
