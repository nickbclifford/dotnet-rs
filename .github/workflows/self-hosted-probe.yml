name: Self-hosted probe

# THROWAWAY: live denial test for the self-hosted admission gate. Never merge.
# A pull_request job on the self-hosted labels must be rejected before any step runs.

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: Self-hosted denial test
    runs-on: [self-hosted, linux, x64, miri]
    timeout-minutes: 10
    steps:
      - run: echo "DENIAL-TEST-STEP-RAN"
