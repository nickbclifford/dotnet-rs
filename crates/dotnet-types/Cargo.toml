[package]
name = "dotnet-types"
version = "0.1.0"
edition = "2024"

[dependencies]
dotnetdll = { workspace = true }
dotnet-utils = { workspace = true, default-features = false }
gc-arena = { workspace = true }
thiserror = { workspace = true }
lru = { workspace = true }
arbitrary = { version = "1.3", features = ["derive"], optional = true }

[dev-dependencies]
static_assertions = "1"

[features]
fuzzing = ["dep:arbitrary"]
generic-constraint-validation = []

[lints]
workspace = true
