[package]
name = "dotnet-metrics"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Enables additional runtime counters/snapshots used by benchmark harnesses.
bench-instrumentation = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
static_assertions = "1"

[lints]
workspace = true
